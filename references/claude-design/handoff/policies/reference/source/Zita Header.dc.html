<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/zita-s-art-studio-design-system-2425aac4-be73-49f2-8113-38d2f5adf854/styles.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="_ds/zita-s-art-studio-design-system-2425aac4-be73-49f2-8113-38d2f5adf854/_ds_bundle.js"></script>
<script src="zita-data.js"></script>
<script src="image-slot.js"></script>
<link rel="stylesheet" href="zita-v2.css">
</helmet>
<div ref="{{ rootRef }}" style="position:relative;z-index:30">
  <sc-if value="{{ announce }}" hint-placeholder-val="{{ true }}">
    <div style="background:#0B4050;color:#F8F8F6;display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 24px;font-family:var(--font-display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;text-align:center">
      <span>{{ bandText }}</span>
      <a href="#" style="color:#CFE4E9;text-decoration:underline;text-underline-offset:.35em">Exhibitions</a>
    </div>
  </sc-if>
  <header onMouseLeave="{{ closeMenu }}" style="position:relative;background:#F8F8F6;border-bottom:1px solid #E3E7E7">
    <div style="max-width:1560px;margin:0 auto;padding:0 clamp(20px,3.4vw,56px);min-height:84px;display:flex;align-items:center;gap:{{ rowGap }};flex-wrap:nowrap">
      <a href="Homepage.dc.html" aria-label="Zita's Art Studio, home" style="text-decoration:none;color:#15202A;display:flex;align-items:center;flex:none;padding:14px 0">
        <span style="display:flex;align-items:center;gap:14px;white-space:nowrap"><span style="font-family:var(--font-display);font-size:21px;letter-spacing:.2em;line-height:1">ZITA’S</span><span style="width:1px;height:20px;background:#A4A9AC"></span><span style="font-family:var(--font-display);font-size:11px;letter-spacing:.32em;line-height:1;color:#3B4044">ART STUDIO</span></span>
      </a>
      <nav aria-label="Main" style="flex:1;display:flex;align-items:center;gap:{{ navGap }};flex-wrap:nowrap;min-width:0">
        <button type="button" aria-expanded="{{ menuOpen }}" aria-haspopup="true" onClick="{{ toggleMenu }}" onMouseEnter="{{ openMenu }}" style="display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:10px 0;cursor:pointer;font-family:var(--font-display);font-size:13px;letter-spacing:{{ track }};text-transform:uppercase;color:{{ origColor }};border-bottom:1px solid {{ origLine }}">Originals<x-import component-from-global-scope="ZitaSArtStudioDesignSystem_2425aa.Icon" name="chevron-down" size="{{ 14 }}" hint-size="14px,14px"></x-import></button>
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
          <a href="{{ l.href }}" onMouseEnter="{{ closeMenu }}" style="padding:10px 0;font-family:var(--font-display);font-size:13px;letter-spacing:{{ track }};text-transform:uppercase;text-decoration:none;white-space:nowrap;color:{{ l.color }};border-bottom:1px solid {{ l.line }}" style-hover="color:#96502A">{{ l.label }}</a>
        </sc-for>
      </nav>
      <div style="display:flex;align-items:center;gap:2px;flex:none">
        <x-import component-from-global-scope="ZitaSArtStudioDesignSystem_2425aa.IconButton" icon="search" label="Search" hint-size="44px,44px"></x-import>
        <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}"><x-import component-from-global-scope="ZitaSArtStudioDesignSystem_2425aa.IconButton" icon="instagram" label="Instagram" hint-size="44px,44px"></x-import></sc-if>
        <x-import component-from-global-scope="ZitaSArtStudioDesignSystem_2425aa.IconButton" icon="shopping-bag" label="Bag" badge="{{ bag }}" hint-size="44px,44px"></x-import>
      </div>
    </div>

    <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
      <div role="menu" style="position:absolute;left:0;right:0;top:100%;background:#F8F8F6;border-top:1px solid #E3E7E7;box-shadow:0 24px 64px -24px rgba(13,20,26,.35)">
        <div style="max-width:1560px;margin:0 auto;padding:40px clamp(20px,3.4vw,56px) 48px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,.9fr);gap:clamp(24px,4vw,64px)">
          <div style="display:grid;gap:4px;align-content:start">
            <div style="font-family:var(--font-display);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#96502A;margin-bottom:12px">Current series</div>
            <sc-for list="{{ series }}" as="s" hint-placeholder-count="3">
              <a href="Works PLP.dc.html" role="menuitem" onMouseEnter="{{ s.hover }}" onFocus="{{ s.hover }}" style="display:grid;gap:2px;padding:12px 0;border-bottom:1px solid #E3E7E7;text-decoration:none;color:#15202A">
                <span style="font-family:var(--font-display);font-size:24px;line-height:1.2;color:{{ s.color }}">{{ s.name }}</span>
                <span style="font-family:var(--font-serif);font-size:15px;color:#565C61">{{ s.status }} · {{ s.count }} originals</span>
              </a>
            </sc-for>
          </div>
          <div style="display:grid;gap:14px;align-content:start;padding-top:30px">
            <a href="Works PLP.dc.html" style="font-family:var(--font-serif);font-size:19px;color:#15202A;text-decoration:none" style-hover="color:#96502A">All originals</a>
            <a href="Works PLP.dc.html" style="font-family:var(--font-serif);font-size:19px;color:#15202A;text-decoration:none" style-hover="color:#96502A">Earlier series &amp; sold work</a>
            <a href="#" style="font-family:var(--font-serif);font-size:19px;color:#15202A;text-decoration:none" style-hover="color:#96502A">Commission a painting</a>
          </div>
          <div style="position:relative;aspect-ratio:1 / 1;background:#F0F2F1;display:flex;align-items:center;justify-content:center;padding:12%;box-sizing:border-box">
            <sc-if value="{{ pvImg }}" hint-placeholder-val="{{ true }}">
              <img src="{{ pvSrc }}" alt="" style="max-width:100%;max-height:100%;box-shadow:0 1px 2px rgba(13,20,26,.06),0 18px 40px -18px rgba(13,20,26,.28)">
            </sc-if>
            <sc-if value="{{ pvSlot }}" hint-placeholder-val="{{ false }}">
              <div style="position:relative;width:80%;aspect-ratio:4 / 5"><image-slot id="series-walking-the-trail" shape="rect" fit="contain" placeholder="Walking the Trail — drop a series image"></image-slot></div>
            </sc-if>
          </div>
        </div>
      </div>
    </sc-if>
  </header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:560},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;Originals&quot;,&quot;Prints&quot;,&quot;Exhibitions&quot;,&quot;About&quot;,&quot;News&quot;,&quot;Contact&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;announce&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;forceOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;bag&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { open: false, pv: 1, w: 1400 };
  _root = React.createRef();
  componentDidMount() {
    this._ro = new ResizeObserver((es) => { const w = es[0].contentRect.width; if (Math.abs(w - (this.state.w || 0)) > 8) this.setState({ w }); });
    if (this._root.current) this._ro.observe(this._root.current);
    this._esc = (e) => { if (e.key === 'Escape') this.setState({ open: false }); };
    window.addEventListener('keydown', this._esc);
  }
  componentWillUnmount() { this._ro && this._ro.disconnect(); window.removeEventListener('keydown', this._esc); }
  renderVals() {
    const Z = window.ZITA; const cur = this.props.current || '';
    const open = this.state.open || !!this.props.forceOpen;
    const links = [['Prints', '#'], ['Exhibitions', '#'], ['About', '#'], ['News', '#'], ['Contact', '#']].map(([label, href]) => ({ label, href, color: cur === label ? '#0F5468' : '#15202A', line: cur === label ? '#0F5468' : 'transparent' }));
    const series = (Z ? Z.activeSeries : []).map((s, i) => ({ ...s, color: this.state.pv === i ? '#0F5468' : '#15202A', hover: () => this.setState({ pv: i }) }));
    const pv = series[this.state.pv] || {};
    const W = this.state.w; const wide = W >= 1180;
    return {
      rootRef: this._root, wide,
      navGap: W >= 1280 ? '34px' : W >= 1000 ? '22px' : '16px', rowGap: W >= 1180 ? '56px' : '28px', track: W >= 1000 ? '.16em' : '.1em',
      bandText: W >= 1000 ? 'Curator’s Choice · Black & White juried international exhibition · Le Gateau Gallery, France' : 'Curator’s Choice · Le Gateau Gallery, France',
      announce: this.props.announce !== false,
      links, series, menuOpen: open,
      pvImg: !!pv.img, pvSlot: !pv.img, pvSrc: pv.img,
      origColor: open || cur === 'Originals' ? '#0F5468' : '#15202A', origLine: cur === 'Originals' ? '#0F5468' : 'transparent',
      bag: this.props.bag || null,
      openMenu: () => { clearTimeout(this._t); this.setState({ open: true }); },
      toggleMenu: () => this.setState((s) => ({ open: !s.open })),
      closeMenu: () => { clearTimeout(this._t); this._t = setTimeout(() => this.setState({ open: false }), 120); }
    };
  }
}
</script>
</body>
</html>
