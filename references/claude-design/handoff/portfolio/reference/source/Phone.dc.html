<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/zita-s-art-studio-design-system-2425aac4-be73-49f2-8113-38d2f5adf854/styles.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="_ds/zita-s-art-studio-design-system-2425aac4-be73-49f2-8113-38d2f5adf854/_ds_bundle.js"></script>
<script src="zita-data.js"></script>
<script src="image-slot.js"></script>
<link rel="stylesheet" href="zita-v2.css">
</helmet>
<div style="display:grid;gap:14px;justify-items:center;flex:none">
  <div style="position:relative;width:390px;height:844px;box-sizing:content-box;border:10px solid #0D141A;border-radius:52px;overflow:hidden;background:#F8F8F6;box-shadow:0 30px 60px -30px rgba(13,20,26,.45);display:flex;flex-direction:column">
    <div style="height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-family:-apple-system,system-ui,sans-serif;font-size:15px;font-weight:600;color:#15202A;background:#F8F8F6">
      <span>9:41</span><span style="width:110px;height:30px;border-radius:20px;background:#0D141A"></span><span style="font-size:12px">●●● ▮</span>
    </div>
    <div style="flex:none;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 20px;background:#F8F8F6;border-bottom:1px solid #E3E7E7;position:relative;z-index:5">
      <a href="Homepage.dc.html" aria-label="Zita’s Art Studio, home" style="display:flex;align-items:center;gap:10px;min-height:44px;color:#15202A;text-decoration:none;white-space:nowrap"><span style="font-family:var(--font-display);font-size:17px;letter-spacing:.2em;line-height:1">ZITA’S</span><span style="width:1px;height:16px;background:#A4A9AC"></span><span style="font-family:var(--font-display);font-size:10px;letter-spacing:.3em;line-height:1;color:#3B4044">ART STUDIO</span></a>
      <div style="display:flex;align-items:center">
        <x-import component-from-global-scope="ZitaSArtStudioDesignSystem_2425aa.IconButton" icon="shopping-bag" label="Bag" hint-size="44px,44px"></x-import>
        <button type="button" onClick="{{ toggle }}" aria-expanded="{{ open }}" style="height:44px;min-width:64px;padding:0 12px;border:0;background:transparent;font-family:var(--font-display);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#15202A;cursor:pointer">{{ menuLabel }}</button>
      </div>
    </div>
    <div style="flex:1;position:relative;min-height:0">
      <div style="position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none">{{ children }}</div>
      <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
        <nav aria-label="Menu" style="position:absolute;inset:0;background:#F8F8F6;overflow-y:auto;z-index:20;padding:24px 20px 36px;box-sizing:border-box;display:flex;flex-direction:column;gap:28px">
          <div style="display:grid;gap:4px">
            <div style="font-family:var(--font-display);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#96502A;margin-bottom:8px">Originals · current series</div>
            <sc-for list="{{ series }}" as="s" hint-placeholder-count="3">
              <a href="Works PLP.dc.html" style="display:flex;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid #E3E7E7;text-decoration:none;color:#15202A;min-height:64px">
                <span style="width:64px;height:64px;flex:none;background:#F0F2F1;display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box;position:relative">
                  <sc-if value="{{ s.img }}" hint-placeholder-val="{{ true }}"><img src="{{ s.img }}" alt="" style="max-width:100%;max-height:100%"></sc-if>
                  <sc-if value="{{ s.noImg }}" hint-placeholder-val="{{ false }}"><span style="position:relative;width:100%;height:100%;display:block"><image-slot id="series-m-{{ s.id }}" shape="rect" placeholder="Image"></image-slot></span></sc-if>
                </span>
                <span style="display:grid;gap:2px"><span style="font-family:var(--font-display);font-size:22px;line-height:1.2">{{ s.name }}</span><span style="font-family:var(--font-serif);font-size:15px;color:#565C61">{{ s.status }}</span></span>
              </a>
            </sc-for>
            <a href="Works PLP.dc.html" style="display:flex;align-items:center;justify-content:space-between;min-height:52px;font-family:var(--font-display);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#0F5468;text-decoration:none">All originals, earlier series &amp; sold work<x-import component-from-global-scope="ZitaSArtStudioDesignSystem_2425aa.Icon" name="arrow-right" size="{{ 16 }}" hint-size="16px,16px"></x-import></a>
          </div>
          <div style="display:grid">
            <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
              <a href="#" style="display:flex;align-items:center;min-height:52px;border-top:1px solid #E3E7E7;font-family:var(--font-display);font-size:19px;color:#15202A;text-decoration:none">{{ l }}</a>
            </sc-for>
          </div>
          <div style="margin-top:auto;display:grid;gap:10px;font-family:var(--font-serif);font-size:16px">
            <a href="#" style="display:inline-flex;align-items:center;gap:8px;color:#15202A;text-decoration:none;min-height:44px"><x-import component-from-global-scope="ZitaSArtStudioDesignSystem_2425aa.Icon" name="instagram" size="{{ 18 }}" hint-size="18px,18px"></x-import>Follow on Instagram</a>
            <a href="mailto:ranjeeta.shroff@gmail.com" style="color:#565C61;text-decoration:none">ranjeeta.shroff@gmail.com</a>
          </div>
        </nav>
      </sc-if>
    </div>
  </div>
  <sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ true }}">
    <div style="font-family:var(--font-display);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#565C61;text-align:center;max-width:390px">{{ label }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:920},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;menuOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;children&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;ReactNode&quot;}}">
class Component extends DCLogic {
  state = { open: null };
  renderVals() {
    const Z = window.ZITA;
    const open = this.state.open == null ? !!this.props.menuOpen : this.state.open;
    return {
      children: this.props.children, open, menuLabel: open ? 'Close' : 'Menu',
      toggle: () => this.setState({ open: !open }),
      series: (Z ? Z.activeSeries : []).map((s) => ({ ...s, noImg: !s.img })),
      links: ['Prints', 'Exhibitions', 'About', 'News', 'Commissions', 'Contact'],
      label: this.props.label || '', hasLabel: !!this.props.label
    };
  }
}
</script>
</body>
</html>
